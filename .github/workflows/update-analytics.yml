name: Update analytics snapshot

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/update-analytics.yml
      - analytics-core.js
      - scripts/update-analytics.mjs
  schedule:
    - cron: "17 08 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-analytics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refresh Cloudflare page views
        run: node scripts/update-analytics.mjs
        env:
          CLOUDFLARE_ANALYTICS_READ_ONLY_KEY_SCOPED: ${{ secrets.CLOUDFLARE_ANALYTICS_READ_ONLY_KEY_SCOPED }}

      - name: Verify analytics behavior
        run: node --test

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/analytics.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analytics.json
          git commit -m "(chore) update analytics snapshot"
          git push
